<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Natural State Medicinals — Education Guide</title>
<link rel="stylesheet" href="fonts-local.css">
<script>
  // Route to the build that fits the device, before anything paints.
  //   ?v=desktop  or  ?v=mobile   forces a version (and is remembered for the visit)
  // Change MOBILE_MAX below if you want a different cut-off.
  (function () {
    var MOBILE_MAX = 760;
    try {
      var q = (location.search.match(/[?&]v=(desktop|mobile)/) || [])[1];
      if (q) { sessionStorage.setItem('nsm-view', q); }
      var pick = q || sessionStorage.getItem('nsm-view');
      if (!pick) {
        var narrow = Math.min(window.innerWidth, window.screen.width || 9999) <= MOBILE_MAX;
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        pick = (narrow || (coarse && window.innerWidth <= 1024)) ? 'mobile' : 'desktop';
      }
      location.replace(pick === 'mobile' ? 'mobile.html' + location.hash : 'desktop.html' + location.hash);
    } catch (e) { /* fall through to the links below */ }
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #20253A; }
  .wrap { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; padding: 40px 24px; text-align: center; }
  .kicker { font-family: 'Caligor Sans Clean', system-ui, sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245,244,225,0.66); margin: 0; }
  h1 { margin: 0; font-family: 'Burford', Georgia, serif; font-weight: 400; line-height: 1.02;
    font-size: clamp(34px, 7vw, 68px); letter-spacing: 0.01em; color: #F5F4E1; }
  .links { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .links a { font-family: 'Caligor Sans Clean', system-ui, sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-decoration: none; color: #20253A; background: #B79550;
    border-radius: 999px; padding: 14px 26px; }
  .links a + a { background: none; color: #F5F4E1; border: 1px solid rgba(245,244,225,0.32); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Natural State Medicinals</p>
    <h1>Education Guide</h1>
    <div class="links">
      <a href="desktop.html">Open the full guide</a>
      <a href="mobile.html">Open the mobile guide</a>
    </div>
  </div>
</body>
</html>
